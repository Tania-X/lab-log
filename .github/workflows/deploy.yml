name: Deploy to Server

on:
  # 手动触发部署
  workflow_dispatch:
    inputs:
      branch:
        description: '要部署的分支'
        required: true
        default: 'main'
        type: string

jobs:
  deploy:
    runs-on: self-hosted  # 在自托管的服务器上运行
    
    steps:
      # 检出指定分支的代码
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}
          # 代码会被检出到 /home/lablog/lab-log/
      
      - name: Show deployment info
        run: |
          echo "✅ 代码已成功部署到服务器"
          echo "📁 部署位置: $(pwd)"
          echo "🌿 部署分支: ${{ github.event.inputs.branch }}"
          echo "🔖 提交哈希: $(git rev-parse --short HEAD)"
          echo ""
          echo "📋 后续操作请手动执行："
          echo "   1. cd $(pwd)"
          echo "   2. docker-compose up -d"
