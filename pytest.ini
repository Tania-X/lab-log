[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --cov=lab_log
    --cov-report=html:htmlcov
    --cov-report=term-missing
    --cov-report=xml
    --cov-fail-under=80
markers =
    unit: 单元测试，测试单个函数/类
    integration: 集成测试，测试模块间协作
    e2e: 端到端测试，测试完整用户流程
    slow: 慢速测试，需要较长时间
    api: API相关测试
    database: 数据库相关测试
    streaming: 流媒体相关测试
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning